name: Daily TEFAS fund prices

on:
  schedule:
    - cron: '30 20 * * *'   # Her gün 20:30 UTC (23:30 TSİ) — TEFAS akşam kapanış fiyatları
  workflow_dispatch:        # Elle de tetiklenebilir

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape TEFAS
        run: python backend/scrape_tefas.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funds.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): TEFAS daily update"
            git push
          fi
